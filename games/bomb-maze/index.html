<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>ボムメイズ</title>
<style>
  :root {
    --bg: #14161c; --panel: #1f232c; --line: #333a47;
    --text: #f2f4f8; --muted: #9aa3b2; --accent: #ff7a3d;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Noto Sans JP", sans-serif;
    -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
  }
  #app { max-width: 540px; margin: 0 auto; padding: 12px 16px 20px; display: flex; flex-direction: column; gap: 10px; }
  header { display: flex; justify-content: space-between; align-items: baseline; }
  h1 { font-size: 20px; margin: 0; letter-spacing: .06em; }
  h1 small { color: var(--accent); font-size: 12px; margin-left: 6px; }
  #best { color: var(--muted); font-size: 12px; }
  #hud { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
  .stat { background: var(--panel); border-radius: 8px; padding: 5px 8px; }
  .stat span { display: block; color: var(--muted); font-size: 10px; }
  .stat b { font-size: 16px; font-variant-numeric: tabular-nums; }
  #powers { display: flex; gap: 12px; font-size: 13px; color: var(--muted); }
  #powers b { color: var(--text); }
  #wrap { position: relative; touch-action: none; }
  canvas { width: 100%; height: auto; display: block; border-radius: 8px; background: #000; }
  #overlay {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
    background: rgba(10, 12, 16, .76); border-radius: 8px; text-align: center; padding: 16px; gap: 12px;
  }
  #overlay.hidden { display: none; }
  #overlay h2 { margin: 0; font-size: 28px; letter-spacing: .05em; }
  #overlay p { margin: 0; color: #d6dbe4; font-size: 14px; line-height: 1.7; }
  #overlay button {
    background: var(--accent); color: #fff; border: 0; border-radius: 999px;
    padding: 10px 28px; font-size: 16px; font-weight: 700; cursor: pointer;
  }
  #overlay button.hidden { display: none; }
  #controls { display: none; justify-content: space-between; align-items: center; touch-action: none; }
  @media (pointer: coarse) { #controls { display: flex; } .keys { display: none; } }
  #dpad { display: grid; grid-template-columns: repeat(3, 58px); grid-template-rows: repeat(3, 58px); gap: 4px; }
  .pad {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    color: var(--text); font-size: 22px; touch-action: none;
  }
  .pad.on { background: #3a4252; }
  #bombBtn {
    width: 100px; height: 100px; border-radius: 50%; border: 0; touch-action: none;
    background: var(--accent); color: #fff; font-size: 18px; font-weight: 800; letter-spacing: .05em;
    box-shadow: 0 6px 0 #b8501f;
  }
  #bombBtn.on { transform: translateY(4px); box-shadow: 0 2px 0 #b8501f; }
  .help { font-size: 12px; color: var(--muted); line-height: 1.7; margin: 0; }
  kbd { background: var(--panel); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; font-size: 11px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>ボムメイズ<small>BOMB MAZE</small></h1>
    <div id="best">BEST 0</div>
  </header>

  <div id="hud">
    <div class="stat"><span>STAGE</span><b id="hStage">1</b></div>
    <div class="stat"><span>LIFE</span><b id="hLife">3</b></div>
    <div class="stat"><span>SCORE</span><b id="hScore">0</b></div>
    <div class="stat"><span>TIME</span><b id="hTime">180</b></div>
  </div>
  <div id="powers">
    <div>💣 <b id="pBomb">1</b></div>
    <div>🔥 <b id="pFire">2</b></div>
    <div>👟 <b id="pSpeed">0</b></div>
    <div>敵 <b id="pEnemy">0</b></div>
  </div>

  <div id="wrap">
    <canvas id="cv"></canvas>
    <div id="overlay">
      <h2 id="oTitle">ボムメイズ</h2>
      <p id="oText"></p>
      <button id="oBtn">スタート</button>
    </div>
  </div>

  <div id="controls">
    <div id="dpad">
      <div></div><button class="pad" data-dir="up">▲</button><div></div>
      <button class="pad" data-dir="left">◀</button><div></div><button class="pad" data-dir="right">▶</button>
      <div></div><button class="pad" data-dir="down">▼</button><div></div>
    </div>
    <button id="bombBtn">BOMB</button>
  </div>

  <p class="help keys">
    移動 <kbd>←↑↓→</kbd> / <kbd>WASD</kbd>　爆弾 <kbd>Space</kbd> / <kbd>Z</kbd>　一時停止 <kbd>P</kbd>
  </p>
  <p class="help">
    爆弾でブロックを壊して敵を全滅させ、ブロックの下に隠れた<b>出口</b>へ進もう。
    アイテム：💣 爆弾の数+1　🔥 火力+1　👟 スピードアップ
  </p>
</div>

<script>
(() => {
  'use strict';

  // ---- 定数 ----
  const COLS = 15, ROWS = 13, T = 32;
  const FLOOR = 0, HARD = 1, SOFT = 2;
  const DIRS = { up: [0, -1], down: [0, 1], left: [-1, 0], right: [1, 0] };
  const DIRLIST = [[0, -1], [0, 1], [-1, 0], [1, 0]];
  const FUSE = 2.4, FLAME_T = 0.55, BURN_T = 0.45, STAGE_TIME = 180;

  const cv = document.getElementById('cv');
  cv.width = COLS * T; cv.height = ROWS * T;
  const ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);

  // ---- 状態 ----
  let grid, hidden, items, bombs, flames, burning, enemies, player, exitOpen;
  let stage = 1, lives = 3, score = 0, timeLeft = STAGE_TIME;
  let state = 'title', stateT = 0, clock = 0;
  let power = { bombs: 1, range: 2, speed: 0 };
  let best = 0;
  try { best = Number(localStorage.getItem('bombmaze-best')) || 0; } catch (e) { /* 無視 */ }

  const held = [];
  let bombQueued = false;

  const key = (x, y) => y * COLS + x;
  const inB = (x, y) => x >= 0 && y >= 0 && x < COLS && y < ROWS;
  const rnd = n => Math.floor(Math.random() * n);
  const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = rnd(i + 1); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const bombAt = (x, y) => bombs.find(b => b.x === x && b.y === y);
  const tileOf = e => [Math.round(e.x), Math.round(e.y)];
  const isIdle = e => e.x === e.tx && e.y === e.ty;

  // ---- ステージ生成 ----
  function buildStage() {
    grid = []; hidden = new Map(); items = new Map(); flames = new Map(); burning = new Map();
    bombs = []; enemies = []; exitOpen = false; timeLeft = STAGE_TIME;
    const softRate = Math.min(0.6, 0.4 + stage * 0.02);

    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
      let c = FLOOR;
      if (x === 0 || y === 0 || x === COLS - 1 || y === ROWS - 1 || (x % 2 === 0 && y % 2 === 0)) c = HARD;
      else if (x + y > 3 && Math.random() < softRate) c = SOFT;
      grid.push(c);
    }

    // ブロックの下にアイテムと出口を隠す
    const softs = [];
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) if (grid[key(x, y)] === SOFT) softs.push([x, y]);
    shuffle(softs);
    const loot = ['exit', 'bomb', 'fire'];
    if (stage % 2 === 1) loot.push('speed');
    loot.push(Math.random() < 0.5 ? 'bomb' : 'fire');
    loot.forEach((type, i) => { if (softs[i]) hidden.set(key(...softs[i]), type); });

    player = { x: 1, y: 1, fx: 1, fy: 1, tx: 1, ty: 1, dir: [0, 1], alive: true, deadT: 0, inv: 2, walk: 0 };

    // 敵の配置（スタート地点から離れた床）
    const spots = [];
    for (let y = 1; y < ROWS - 1; y++) for (let x = 1; x < COLS - 1; x++)
      if (grid[key(x, y)] === FLOOR && x + y >= 8) spots.push([x, y]);
    shuffle(spots);
    const n = Math.min(3 + stage, 10);
    const ghosts = Math.min(Math.floor((stage - 1) / 2) + (stage >= 2 ? 1 : 0), Math.floor(n / 2));
    for (let i = 0; i < n && i < spots.length; i++) {
      const [x, y] = spots[i];
      const ghost = i < ghosts;
      enemies.push({
        x, y, fx: x, fy: y, tx: x, ty: y, dir: DIRLIST[rnd(4)],
        type: ghost ? 'ghost' : 'slime', wall: ghost,
        spd: ghost ? 2.1 + stage * 0.05 : 1.5 + stage * 0.06,
        dead: false, deadT: 0, phase: Math.random() * 6,
      });
    }
  }

  // ---- 移動 ----
  function canEnter(e, x, y) {
    if (!inB(x, y)) return false;
    const g = grid[key(x, y)];
    if (g === HARD) return false;
    if (g === SOFT && !e.wall) return false;
    const [cx, cy] = tileOf(e);
    if (bombAt(x, y) && !(x === cx && y === cy)) return false;
    return true;
  }

  function step(e, dt, spd) {
    if (isIdle(e)) return true;
    const d = spd * dt;
    const dx = e.tx - e.x, dy = e.ty - e.y;
    if (d >= Math.abs(dx) + Math.abs(dy)) {
      e.x = e.tx; e.y = e.ty; e.fx = e.tx; e.fy = e.ty;
      return true;
    }
    e.x += Math.sign(dx) * d; e.y += Math.sign(dy) * d;
    return false;
  }

  function moveTo(e, dx, dy) {
    e.fx = e.x; e.fy = e.y; e.tx = e.x + dx; e.ty = e.y + dy; e.dir = [dx, dy];
  }

  // ---- 爆発 ----
  function addFlame(x, y, kind) {
    const k = key(x, y), cur = flames.get(k);
    const k2 = cur && cur.kind !== kind ? 'c' : kind;
    flames.set(k, { x, y, t: FLAME_T, kind: k2 });
  }

  function explode(first) {
    const queue = [first];
    while (queue.length) {
      const b = queue.pop();
      const i = bombs.indexOf(b);
      if (i < 0) continue;
      bombs.splice(i, 1);
      addFlame(b.x, b.y, 'c');
      for (const [dx, dy] of DIRLIST) {
        const kind = dx ? 'h' : 'v';
        for (let r = 1; r <= b.range; r++) {
          const x = b.x + dx * r, y = b.y + dy * r, k = key(x, y);
          const g = grid[k];
          if (g === HARD) break;
          if (g === SOFT) {
            addFlame(x, y, 'c');
            if (!burning.has(k)) { burning.set(k, { x, y, t: BURN_T }); score += 10; }
            break;
          }
          const other = bombAt(x, y);
          if (other) { addFlame(x, y, 'c'); queue.push(other); break; }
          const it = items.get(k);
          if (it && it !== 'exit') { items.delete(k); addFlame(x, y, kind); break; }
          addFlame(x, y, kind);
        }
      }
    }
  }

  // ---- 更新 ----
  function update(dt) {
    clock += dt;
    if (state === 'intro') {
      stateT -= dt;
      if (stateT <= 0) { state = 'play'; hideOverlay(); }
      return;
    }
    if (state === 'clear') {
      stateT -= dt;
      if (stateT <= 0) { stage++; buildStage(); startIntro(); }
      return;
    }
    if (state !== 'play' && state !== 'dying') return;

    // 爆弾・炎・ブロック崩し
    for (const b of [...bombs]) { b.t -= dt; if (b.t <= 0 && bombs.includes(b)) explode(b); }
    for (const [k, f] of flames) { f.t -= dt; if (f.t <= 0) flames.delete(k); }
    for (const [k, s] of burning) {
      s.t -= dt;
      if (s.t <= 0) {
        burning.delete(k); grid[k] = FLOOR;
        const h = hidden.get(k);
        if (h) { items.set(k, h); hidden.delete(k); }
      }
    }

    updateEnemies(dt);

    if (state === 'dying') {
      player.deadT += dt;
      if (player.deadT > 1.6) {
        lives--;
        if (lives <= 0) gameOver();
        else { buildStage(); startIntro(); }
      }
      return;
    }

    updatePlayer(dt);

    timeLeft -= dt;
    if (timeLeft <= 0) { timeLeft = 0; killPlayer(); }
  }

  function updatePlayer(dt) {
    const p = player;
    if (p.inv > 0) p.inv -= dt;

    const name = held[held.length - 1];
    if (name) {
      const [dx, dy] = DIRS[name];
      if (isIdle(p)) {
        p.dir = [dx, dy];
        if (canEnter(p, p.x + dx, p.y + dy)) moveTo(p, dx, dy);
      } else {
        const mdx = Math.sign(p.tx - p.fx), mdy = Math.sign(p.ty - p.fy);
        if (mdx === -dx && mdy === -dy) { // その場で引き返す
          [p.fx, p.tx] = [p.tx, p.fx]; [p.fy, p.ty] = [p.ty, p.fy]; p.dir = [dx, dy];
        }
      }
    }
    const moving = !isIdle(p);
    step(p, dt, 3.6 + power.speed * 0.6);
    if (moving) p.walk += dt;

    if (bombQueued) {
      bombQueued = false;
      const [bx, by] = tileOf(p);
      if (grid[key(bx, by)] === FLOOR && !bombAt(bx, by) && bombs.length < power.bombs) {
        bombs.push({ x: bx, y: by, t: FUSE, range: power.range });
      }
    }

    const [px, py] = tileOf(p), pk = key(px, py);

    // アイテム
    const it = items.get(pk);
    if (it && it !== 'exit') {
      items.delete(pk); score += 50;
      if (it === 'bomb') power.bombs = Math.min(8, power.bombs + 1);
      if (it === 'fire') power.range = Math.min(8, power.range + 1);
      if (it === 'speed') power.speed = Math.min(4, power.speed + 1);
    }

    // 出口
    if (it === 'exit' && exitOpen && isIdle(p)) { stageClear(); return; }

    // 炎・敵との接触
    if (flames.has(pk) && p.inv <= 0) { killPlayer(); return; }
    if (p.inv <= 0) {
      for (const e of enemies) {
        if (!e.dead && Math.abs(e.x - p.x) < 0.62 && Math.abs(e.y - p.y) < 0.62) { killPlayer(); return; }
      }
    }
  }

  function updateEnemies(dt) {
    for (const e of enemies) {
      if (e.dead) { e.deadT += dt; continue; }
      e.phase += dt;
      if (step(e, dt, e.spd)) chooseDir(e);
      const [ex, ey] = tileOf(e);
      if (flames.has(key(ex, ey))) {
        e.dead = true; e.deadT = 0;
        score += e.type === 'ghost' ? 200 : 100;
      }
    }
    enemies = enemies.filter(e => !e.dead || e.deadT < 0.7);
    if (!exitOpen && enemies.every(e => e.dead)) exitOpen = true;
  }

  function chooseDir(e) {
    const opts = DIRLIST.filter(([dx, dy]) => canEnter(e, e.x + dx, e.y + dy));
    if (!opts.length) return;
    const same = (a, b) => a[0] === b[0] && a[1] === b[1];
    let pick;
    if (e.type === 'ghost' && player.alive && Math.random() < 0.45) {
      opts.sort((a, b) =>
        (Math.abs(e.x + a[0] - player.x) + Math.abs(e.y + a[1] - player.y)) -
        (Math.abs(e.x + b[0] - player.x) + Math.abs(e.y + b[1] - player.y)));
      pick = opts[0];
    } else {
      const forward = opts.find(o => same(o, e.dir));
      const turns = opts.filter(o => !same(o, [-e.dir[0], -e.dir[1]]));
      if (forward && Math.random() < (turns.length > 1 ? 0.65 : 0.95)) pick = forward;
      else pick = (turns.length ? turns : opts)[rnd(turns.length || opts.length)];
    }
    moveTo(e, pick[0], pick[1]);
  }

  function killPlayer() {
    if (!player.alive) return;
    player.alive = false; player.deadT = 0; state = 'dying';
  }

  // ---- 画面遷移 ----
  function saveBest() {
    if (score > best) {
      best = score;
      try { localStorage.setItem('bombmaze-best', String(best)); } catch (e) { /* 無視 */ }
    }
  }

  function startIntro() {
    state = 'intro'; stateT = 1.4; held.length = 0; bombQueued = false;
    showOverlay(`STAGE ${stage}`, `敵 ${enemies.length} 体`, null);
  }

  function stageClear() {
    const bonus = Math.floor(timeLeft) * 10;
    score += bonus; saveBest();
    state = 'clear'; stateT = 2.2;
    showOverlay('STAGE CLEAR!', `タイムボーナス +${bonus}`, null);
  }

  function gameOver() {
    saveBest();
    state = 'over';
    showOverlay('GAME OVER', `ステージ ${stage}　スコア ${score}<br>ベスト ${best}`, 'もう一度');
  }

  function newGame() {
    stage = 1; lives = 3; score = 0; power = { bombs: 1, range: 2, speed: 0 };
    buildStage(); startIntro();
  }

  function togglePause() {
    if (state === 'play') { state = 'paused'; showOverlay('PAUSE', 'P キーかボタンで再開', '再開'); }
    else if (state === 'paused') { state = 'play'; hideOverlay(); }
  }

  function showOverlay(title, text, btn) {
    $('oTitle').textContent = title;
    $('oText').innerHTML = text;
    $('oBtn').textContent = btn || '';
    $('oBtn').classList.toggle('hidden', !btn);
    $('overlay').classList.remove('hidden');
  }
  function hideOverlay() { $('overlay').classList.add('hidden'); }

  $('oBtn').addEventListener('click', () => {
    if (state === 'paused') togglePause();
    else if (state === 'title' || state === 'over') newGame();
  });

  // ---- 入力 ----
  const KEYMAP = {
    ArrowUp: 'up', ArrowDown: 'down', ArrowLeft: 'left', ArrowRight: 'right',
    w: 'up', s: 'down', a: 'left', d: 'right', W: 'up', S: 'down', A: 'left', D: 'right',
  };
  const press = d => { if (!held.includes(d)) held.push(d); };
  const release = d => { const i = held.indexOf(d); if (i >= 0) held.splice(i, 1); };

  window.addEventListener('keydown', ev => {
    const d = KEYMAP[ev.key];
    if (d) { press(d); ev.preventDefault(); return; }
    if (ev.key === ' ' || ev.key === 'z' || ev.key === 'Z' || ev.key === 'x' || ev.key === 'X') {
      ev.preventDefault();
      if (state === 'play' && !ev.repeat) bombQueued = true;
      return;
    }
    if (ev.key === 'Enter' && (state === 'title' || state === 'over')) newGame();
    if (ev.key === 'p' || ev.key === 'P' || ev.key === 'Escape') togglePause();
  });
  window.addEventListener('keyup', ev => { const d = KEYMAP[ev.key]; if (d) release(d); });
  window.addEventListener('blur', () => { held.length = 0; });

  document.querySelectorAll('.pad').forEach(btn => {
    const d = btn.dataset.dir;
    const off = () => { release(d); btn.classList.remove('on'); };
    btn.addEventListener('pointerdown', ev => {
      ev.preventDefault(); btn.setPointerCapture(ev.pointerId); press(d); btn.classList.add('on');
    });
    btn.addEventListener('pointerup', off);
    btn.addEventListener('pointercancel', off);
    btn.addEventListener('lostpointercapture', off);
  });
  const bombBtn = $('bombBtn');
  bombBtn.addEventListener('pointerdown', ev => {
    ev.preventDefault(); bombBtn.classList.add('on');
    if (state === 'play') bombQueued = true;
  });
  ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => bombBtn.addEventListener(t, () => bombBtn.classList.remove('on')));
  document.addEventListener('contextmenu', ev => ev.preventDefault());

  // ---- 描画 ----
  function roundRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
  }

  function drawHard(px, py) {
    ctx.fillStyle = '#3e4550'; ctx.fillRect(px, py, T, T);
    ctx.fillStyle = '#7d8796'; ctx.fillRect(px, py, T - 3, T - 3);
    ctx.fillStyle = '#5f6876'; ctx.fillRect(px + 3, py + 3, T - 6, T - 6);
    ctx.fillStyle = 'rgba(255,255,255,.12)'; ctx.fillRect(px + 6, py + 6, T - 18, 3);
  }

  function drawSoft(px, py, burnRatio) {
    ctx.save();
    if (burnRatio != null) {
      ctx.globalAlpha = burnRatio;
      const s = 0.6 + 0.4 * burnRatio;
      ctx.translate(px + T / 2, py + T / 2); ctx.scale(s, s); ctx.translate(-px - T / 2, -py - T / 2);
    }
    ctx.fillStyle = burnRatio != null ? '#e0662a' : '#b9773e'; ctx.fillRect(px, py, T, T);
    ctx.strokeStyle = '#7d4a20'; ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(px, py + T / 3); ctx.lineTo(px + T, py + T / 3);
    ctx.moveTo(px, py + 2 * T / 3); ctx.lineTo(px + T, py + 2 * T / 3);
    ctx.moveTo(px + T / 2, py); ctx.lineTo(px + T / 2, py + T / 3);
    ctx.moveTo(px + T / 4, py + T / 3); ctx.lineTo(px + T / 4, py + 2 * T / 3);
    ctx.moveTo(px + 3 * T / 4, py + T / 3); ctx.lineTo(px + 3 * T / 4, py + 2 * T / 3);
    ctx.moveTo(px + T / 2, py + 2 * T / 3); ctx.lineTo(px + T / 2, py + T);
    ctx.stroke();
    ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.strokeRect(px + 1, py + 1, T - 2, T - 2);
    ctx.restore();
  }

  function drawExit(px, py) {
    ctx.fillStyle = '#20242e'; roundRect(px + 3, py + 3, T - 6, T - 6, 4); ctx.fill();
    for (let i = 0; i < 3; i++) {
      ctx.fillStyle = `rgba(150,160,180,${0.25 + i * 0.15})`;
      ctx.fillRect(px + 7 + i * 3, py + 9 + i * 6, T - 14 - i * 6, 4);
    }
    if (exitOpen) {
      const a = 0.45 + 0.35 * Math.sin(clock * 6);
      ctx.strokeStyle = `rgba(80,230,255,${a})`; ctx.lineWidth = 3;
      roundRect(px + 3, py + 3, T - 6, T - 6, 4); ctx.stroke();
    }
  }

  function drawItem(px, py, type) {
    const colors = { bomb: '#d9433b', fire: '#f08a1c', speed: '#2f86e6' };
    const bob = Math.sin(clock * 4 + px) * 1.5;
    ctx.fillStyle = colors[type]; roundRect(px + 4, py + 4 + bob, T - 8, T - 8, 6); ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,.7)'; ctx.lineWidth = 2; ctx.stroke();
    const cx = px + T / 2, cy = py + T / 2 + bob;
    if (type === 'bomb') {
      ctx.fillStyle = '#111'; ctx.beginPath(); ctx.arc(cx, cy + 2, 7, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(cx + 4, cy - 4); ctx.lineTo(cx + 7, cy - 8); ctx.stroke();
    } else if (type === 'fire') {
      ctx.fillStyle = '#ffe36b'; ctx.beginPath();
      ctx.moveTo(cx, cy - 9); ctx.quadraticCurveTo(cx + 9, cy + 1, cx, cy + 8);
      ctx.quadraticCurveTo(cx - 9, cy + 1, cx, cy - 9); ctx.fill();
      ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(cx, cy + 3, 3, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.strokeStyle = '#fff'; ctx.lineWidth = 3; ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(cx - 7, cy - 6); ctx.lineTo(cx - 1, cy); ctx.lineTo(cx - 7, cy + 6);
      ctx.moveTo(cx + 1, cy - 6); ctx.lineTo(cx + 7, cy); ctx.lineTo(cx + 1, cy + 6);
      ctx.stroke(); ctx.lineCap = 'butt';
    }
  }

  function drawBomb(b) {
    const px = b.x * T + T / 2, py = b.y * T + T / 2;
    const rate = b.t < 0.8 ? 18 : 8;
    const s = 1 + 0.08 * Math.sin(clock * rate);
    ctx.fillStyle = 'rgba(0,0,0,.25)';
    ctx.beginPath(); ctx.ellipse(px, py + 11, 10, 3.5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = b.t < 0.8 && Math.sin(clock * rate) > 0 ? '#7a1d1d' : '#15171c';
    ctx.beginPath(); ctx.arc(px, py + 1, 11 * s, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.35)';
    ctx.beginPath(); ctx.arc(px - 4 * s, py - 3 * s, 3 * s, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#c9a36a'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(px + 5, py - 8); ctx.quadraticCurveTo(px + 9, py - 14, px + 12, py - 12); ctx.stroke();
    ctx.fillStyle = Math.random() < 0.5 ? '#ffd23f' : '#ff6a00';
    ctx.beginPath(); ctx.arc(px + 12, py - 12, 2.5 + Math.random() * 1.5, 0, Math.PI * 2); ctx.fill();
  }

  function drawFlame(f) {
    const px = f.x * T, py = f.y * T;
    const k = Math.max(0, f.t / FLAME_T);
    const layers = [['#ff5a00', 1], ['#ffb300', 0.68], ['#fff6c8', 0.34]];
    for (const [color, w] of layers) {
      const ww = T * w * (0.55 + 0.45 * k);
      ctx.fillStyle = color;
      if (f.kind === 'h') ctx.fillRect(px, py + (T - ww) / 2, T, ww);
      else if (f.kind === 'v') ctx.fillRect(px + (T - ww) / 2, py, ww, T);
      else { roundRect(px + (T - ww) / 2, py + (T - ww) / 2, ww, ww, ww / 3); ctx.fill(); }
    }
  }

  function drawPlayer() {
    const p = player;
    if (p.alive && p.inv > 0 && Math.floor(clock * 12) % 2 === 0) return;
    const cx = p.x * T + T / 2, cy = p.y * T + T / 2;
    ctx.save();
    ctx.translate(cx, cy);
    if (!p.alive) {
      const k = Math.min(1, p.deadT / 1.2);
      ctx.rotate(k * Math.PI * 4); ctx.scale(1 - k, 1 - k); ctx.globalAlpha = 1 - k * 0.6;
    }
    const bob = isIdle(p) ? 0 : Math.abs(Math.sin(p.walk * 14)) * -2;
    const leg = isIdle(p) ? 0 : Math.sin(p.walk * 14) * 3;
    // 影
    ctx.fillStyle = 'rgba(0,0,0,.25)';
    ctx.beginPath(); ctx.ellipse(0, 13, 9, 3, 0, 0, Math.PI * 2); ctx.fill();
    // 足
    ctx.fillStyle = '#1f2937';
    ctx.fillRect(-6, 8 + leg * 0.3, 4, 5 - leg * 0.3); ctx.fillRect(2, 8 - leg * 0.3, 4, 5 + leg * 0.3);
    // 体（タンクトップ）
    ctx.translate(0, bob);
    ctx.fillStyle = '#f5c79e';
    ctx.beginPath(); ctx.arc(-9, 3, 3.2, 0, Math.PI * 2); ctx.arc(9, 3, 3.2, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#2563eb'; roundRect(-7, -1, 14, 11, 4); ctx.fill();
    // 頭
    ctx.fillStyle = '#f5c79e';
    ctx.beginPath(); ctx.arc(0, -7, 8.5, 0, Math.PI * 2); ctx.fill();
    // ハチマキ
    ctx.fillStyle = '#ef4444'; ctx.fillRect(-8.5, -12, 17, 3.5);
    ctx.fillRect(p.dir[0] > 0 ? -12 : 8, -12 + Math.sin(clock * 10) * 1, 4, 2.5);
    // 目
    const ex = p.dir[0] * 2.5, ey = p.dir[1] * 1.5;
    ctx.fillStyle = '#111';
    if (p.dir[1] < 0) { /* 後ろ向き */ } else {
      ctx.beginPath(); ctx.arc(-3 + ex, -6 + ey, 1.6, 0, Math.PI * 2); ctx.arc(3 + ex, -6 + ey, 1.6, 0, Math.PI * 2); ctx.fill();
    }
    ctx.restore();
  }

  function drawEnemy(e) {
    const cx = e.x * T + T / 2, cy = e.y * T + T / 2;
    ctx.save();
    ctx.translate(cx, cy);
    if (e.dead) {
      const k = Math.min(1, e.deadT / 0.7);
      ctx.globalAlpha = 1 - k; ctx.scale(1 + k * 0.6, 1 - k * 0.8);
    }
    if (e.type === 'slime') {
      const w = Math.sin(e.phase * 8) * 1.5;
      ctx.fillStyle = 'rgba(0,0,0,.25)';
      ctx.beginPath(); ctx.ellipse(0, 12, 11, 3, 0, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#a855f7';
      ctx.beginPath();
      ctx.moveTo(-12 - w, 12);
      ctx.quadraticCurveTo(-12, -12 + w, 0, -12 + w);
      ctx.quadraticCurveTo(12, -12 + w, 12 + w, 12);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,.25)';
      ctx.beginPath(); ctx.ellipse(-5, -5, 3, 4, -0.4, 0, Math.PI * 2); ctx.fill();
    } else {
      ctx.globalAlpha *= 0.85;
      const fl = Math.sin(e.phase * 5) * 2;
      ctx.translate(0, fl);
      ctx.fillStyle = '#60c5fa';
      ctx.beginPath();
      ctx.arc(0, -3, 11, Math.PI, 0);
      ctx.lineTo(11, 11);
      for (let i = 0; i < 4; i++) {
        const x0 = 11 - i * 5.5;
        ctx.quadraticCurveTo(x0 - 2.75, 7 + Math.sin(e.phase * 10 + i) * 2, x0 - 5.5, 11);
      }
      ctx.closePath(); ctx.fill();
    }
    // 目
    const lx = e.dir[0] * 2, ly = e.dir[1] * 2;
    ctx.fillStyle = '#fff';
    ctx.beginPath(); ctx.arc(-4, -2, 3.6, 0, Math.PI * 2); ctx.arc(4, -2, 3.6, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#111';
    ctx.beginPath(); ctx.arc(-4 + lx, -2 + ly, 1.8, 0, Math.PI * 2); ctx.arc(4 + lx, -2 + ly, 1.8, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }

  function draw() {
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
      const px = x * T, py = y * T, g = grid[key(x, y)];
      if (g === HARD) { drawHard(px, py); continue; }
      ctx.fillStyle = (x + y) % 2 ? '#3f8a3a' : '#46943f';
      ctx.fillRect(px, py, T, T);
      if (y > 0 && grid[key(x, y - 1)] !== FLOOR) { ctx.fillStyle = 'rgba(0,0,0,.2)'; ctx.fillRect(px, py, T, 6); }
    }
    for (const [k, type] of items) {
      const x = k % COLS, y = Math.floor(k / COLS);
      if (type === 'exit') drawExit(x * T, y * T); else drawItem(x * T, y * T, type);
    }
    for (let y = 0; y < ROWS; y++) for (let x = 0; x < COLS; x++) {
      const k = key(x, y);
      if (grid[k] === SOFT) {
        const b = burning.get(k);
        drawSoft(x * T, y * T, b ? b.t / BURN_T : null);
      }
    }
    bombs.forEach(drawBomb);
    flames.forEach(drawFlame);
    enemies.forEach(drawEnemy);
    drawPlayer();

    if (exitOpen && state === 'play' && clock % 1 < 0.6 && [...items.values()].includes('exit') === false) {
      // 出口がまだ見つかっていない場合のヒント
      ctx.fillStyle = 'rgba(0,0,0,.5)'; ctx.fillRect(0, 0, cv.width, 22);
      ctx.fillStyle = '#7fe3ff'; ctx.font = 'bold 13px system-ui, sans-serif'; ctx.textAlign = 'center';
      ctx.fillText('敵全滅！ブロックを壊して出口を探そう', cv.width / 2, 15);
    }
  }

  function updateHud() {
    $('hStage').textContent = stage;
    $('hLife').textContent = '♥'.repeat(Math.max(0, lives));
    $('hScore').textContent = score;
    $('hTime').textContent = Math.ceil(timeLeft);
    $('pBomb').textContent = power.bombs;
    $('pFire').textContent = power.range;
    $('pSpeed').textContent = power.speed;
    $('pEnemy').textContent = enemies ? enemies.filter(e => !e.dead).length : 0;
    $('best').textContent = `BEST ${Math.max(best, score)}`;
  }

  // ---- ループ ----
  let last = performance.now();
  function frame(now) {
    const dt = Math.min(0.05, (now - last) / 1000);
    last = now;
    update(dt);
    draw();
    updateHud();
    requestAnimationFrame(frame);
  }

  buildStage();
  showOverlay('ボムメイズ', '爆弾で道を切り開き、敵を全滅させて<br>出口へ向かえ！', 'スタート');
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
